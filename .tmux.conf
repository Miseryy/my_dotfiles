# -------------------------------------------------------------------
# General Options
# -------------------------------------------------------------------

# プレフィックスキーを C-b から C-q に変更 (VimのC-bと被らない、押しやすい)
set -g prefix C-q
unbind C-b
bind C-s send-prefix

# キーストロークのディレイを減らす (VimのESC遅延防止に必須)
set -sg escape-time 0

# インデックスを1から始める (0はキーボードの右端で押しにくい)
set -g base-index 1
setw -g pane-base-index 1

# 色設定 (256色 + TrueColor)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# マウス操作を有効にする (スクロールやリサイズ用)
# set -g mouse on

set -g focus-events on

# リロード設定 (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# -------------------------------------------------------------------
# Vim-like Bindings (ここが重要)
# -------------------------------------------------------------------

# ペイン分割を直感的に
bind | split-window -h -c "#{pane_current_path}" # 横分割
bind - split-window -v -c "#{pane_current_path}" # 縦分割

# ペイン移動 (Vimキーバインド)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインのリサイズ (Prefix + H/J/K/L で調整)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# コピーモードをVimライクに
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -i -sel clip"

# -------------------------------------------------------------------
# Status Bar (Glass Style)
# -------------------------------------------------------------------

# ステータスバーを上に配置 (i3wmと被らないなら下でもOK)
set-option -g status-position top

# 更新頻度
set-option -g status-interval 1

# 色設定 (背景透明・文字白)
set-option -g status-style bg=default,fg=white

# 左側 (セッション名)
set-option -g status-left-length 20
set-option -g status-left "#[fg=green,bold] #S #[fg=default] "

# 右側 (時計)
set-option -g status-right "#[fg=cyan] %Y-%m-%d %H:%M "

# ウィンドウリストのデザイン
set-window-option -g window-status-format " #I:#W- "
set-window-option -g window-status-current-format "#[fg=green,bold] #I:#W* "

# -------------------------------------------------------------------
# Plugin Manager (TPM)
# -------------------------------------------------------------------
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm が必要

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
